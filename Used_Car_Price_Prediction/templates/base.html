<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}CarRcheck{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><style>
  .theme-toggle{border:1px solid #d7e3e5;background:#fff;color:var(--ink);padding:10px 13px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}.theme-toggle:hover{border-color:var(--mint)}
  body.dark-theme{background:#0b1720;color:#e8f1f4}body.dark-theme .nav{background:#0d1e29;border-color:#203642}body.dark-theme .brand{color:#e8f1f4}body.dark-theme .links a{color:#9bb0ba}body.dark-theme .links a:hover{color:#fff}body.dark-theme .nav-cta{background:var(--mint);color:#071522!important}body.dark-theme .theme-toggle{background:#142b38;color:#e8f1f4;border-color:#385462}
  body.dark-theme .hero,body.dark-theme .page-head,body.dark-theme .info-panel,body.dark-theme .form-card{background:#10232f}body.dark-theme .hero h1,body.dark-theme .page-head h1,body.dark-theme .section h2,body.dark-theme .two-col h2,body.dark-theme .info-panel h3{color:#e8f1f4}body.dark-theme .lead,body.dark-theme .cards p,body.dark-theme .two-col p{color:#a8bbc3}body.dark-theme .floating-card{background:#17313e;box-shadow:0 15px 45px #0008}body.dark-theme .cards article{border-color:#294551}body.dark-theme input,body.dark-theme select{background:#142b38;color:#e8f1f4;border-color:#385462}body.dark-theme select:invalid{color:#9bb0ba}body.dark-theme .alert{background:#3b2a20;color:#ffd2ad}body.dark-theme code{background:#294551}body.dark-theme .detail-list{background:#294551}body.dark-theme .detail-list div{background:#10232f}body.dark-theme .detail-list span{color:#9bb0ba}body.dark-theme footer{background:#0b1720}
</style><style>
  body.dark-theme label,body.dark-theme .cards h3,body.dark-theme .floating-card b,body.dark-theme .result h1{color:#e8f1f4}body.dark-theme .floating-card small,body.dark-theme .hint,body.dark-theme .field-hint{color:#a8bbc3}body.dark-theme input::placeholder{color:#8fa6b0}body.dark-theme .number{color:#73a8ff}body.dark-theme .button{background:#17313e;color:#f4fbfc}body.dark-theme .button span{color:#55d6b5}
</style></head>
<body><nav class="nav"><a class="brand" href="{{ url_for('index') }}"><span>CR</span> CarRcheck</a><div class="links"><a href="{{ url_for('index') }}">Home</a><a href="{{ url_for('about') }}">About</a><a class="nav-cta" href="{{ url_for('predict') }}">Estimate price</a><button class="theme-toggle" type="button" aria-label="Toggle dark theme" aria-pressed="false">☾ Dark</button></div></nav>
<main>{% block content %}{% endblock %}</main><footer><span>CarRcheck · Used Car Price Prediction System</span><span>Estimated value, informed by data.</span></footer><script src="{{ url_for('static', filename='js/script.js') }}"></script></body></html>
